<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Resume Auto Fill</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="section">
    <h2>📝 Resume Auto Fill v1.3.0</h2>
    
    <div class="field-group">
      <label for="fullName">Full Name *</label>
      <input type="text" id="fullName" placeholder="John Doe">
    </div>
    
    <div class="field-group">
      <label for="email">Email *</label>
      <input type="email" id="email" placeholder="john@example.com">
    </div>
    
    <div class="field-group">
      <label for="phone">Phone *</label>
      <input type="tel" id="phone" placeholder="+1234567890">
    </div>
    
    <div class="field-group">
      <label for="designation">Current Title</label>
      <input type="text" id="designation" placeholder="Software Engineer">
    </div>
    
    <div class="field-group">
      <label for="experience">Years of Experience</label>
      <input type="text" id="experience" placeholder="5">
    </div>
    
    <div class="field-group">
      <label for="skills">Skills</label>
      <textarea id="skills" placeholder="JavaScript, Python, React..."></textarea>
    </div>
    
    <div class="field-group">
      <label for="linkedin">LinkedIn URL</label>
      <input type="url" id="linkedin" placeholder="https://linkedin.com/in/yourprofile">
    </div>
    
    <div class="field-group">
      <label for="github">GitHub URL</label>
      <input type="url" id="github" placeholder="https://github.com/yourusername">
    </div>
    
    <div class="divider"></div>
    
    <h3 style="font-size: 14px; margin: 0 0 12px 0;">Custom Fields</h3>
    <div id="customFieldsContainer"></div>
    
    <div class="field-group">
      <input type="text" id="newCustomKey" placeholder="Field name (e.g., Current Company)">
    </div>
    <div class="field-group">
      <input type="text" id="newCustomValue" placeholder="Field value">
    </div>
    <button id="addCustomFieldBtn" class="btn-secondary btn-small">+ Add Custom Field</button>
    
    <div class="button-group">
      <button id="saveProfileBtn" class="btn-primary">💾 Save</button>
      <button id="autofillBtn" class="btn-secondary">✨ Fill Form</button>
    </div>
    
    <div class="button-group">
      <button id="exportBtn" class="btn-secondary btn-small">📤 Export</button>
      <button id="importBtn" class="btn-secondary btn-small">📥 Import</button>
      <button id="clearBtn" class="btn-danger btn-small">🗑️ Clear All</button>
    </div>
    
    <div id="statusMessage"></div>
    <div id="stats" style="font-size: 11px; color: #777; margin-top: 8px;"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
