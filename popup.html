<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Resume Auto Fill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Resume Profile</h1>
    
    <!-- Personal Details -->
    <h2>Personal Details</h2>
    <div class="field-group">
      <label>Full Name</label>
      <input id="fullName" type="text" />
    </div>
    <div class="field-group">
      <label>Email</label>
      <input id="email" type="email" />
    </div>
    <div class="field-group">
      <label>Phone</label>
      <input id="phone" type="text" />
    </div>
    <div class="field-group">
      <label>City</label>
      <input id="city" type="text" />
    </div>
    <div class="field-group">
      <label>State</label>
      <input id="state" type="text" />
    </div>
    <div class="field-group">
      <label>Country</label>
      <input id="country" type="text" />
    </div>
    <div class="field-group">
      <label>ZIP/PIN Code</label>
      <input id="zipCode" type="text" />
    </div>
    <div class="field-group">
      <label>LinkedIn URL</label>
      <input id="linkedin" type="text" />
    </div>
    <div class="field-group">
      <label>GitHub URL</label>
      <input id="github" type="text" />
    </div>
    <div class="field-group">
      <label>Portfolio/Website</label>
      <input id="portfolio" type="text" />
    </div>
    
    <!-- Professional Summary -->
    <h2>Professional Summary</h2>
    <div class="field-group">
      <label>Summary (3-4 lines)</label>
      <textarea id="summary" rows="4"></textarea>
    </div>
    
    <!-- Work Experience -->
    <h2>Current Work Experience</h2>
    <div class="field-group">
      <label>Current Job Title/Designation</label>
      <input id="designation" type="text" />
    </div>
    <div class="field-group">
      <label>Current Company</label>
      <input id="currentCompany" type="text" />
    </div>
    <div class="field-group">
      <label>Total Experience (e.g., 10 years 6 months)</label>
      <input id="experience" type="text" />
    </div>
    <div class="field-group">
      <label>Relevant Experience</label>
      <input id="relevantExperience" type="text" />
    </div>
    <div class="field-group">
      <label>Key Responsibilities</label>
      <textarea id="responsibilities" rows="4"></textarea>
    </div>
    <div class="field-group">
      <label>Key Achievements</label>
      <textarea id="achievements" rows="4"></textarea>
    </div>
    
    <!-- Education -->
    <h2>Education</h2>
    <div class="field-group">
      <label>Highest Degree</label>
      <input id="degree" type="text" />
    </div>
    <div class="field-group">
      <label>Specialization</label>
      <input id="specialization" type="text" />
    </div>
    <div class="field-group">
      <label>Institution</label>
      <input id="institution" type="text" />
    </div>
    <div class="field-group">
      <label>Graduation Year</label>
      <input id="graduationYear" type="text" />
    </div>
    
    <!-- Skills -->
    <h2>Skills & Expertise</h2>
    <div class="field-group">
      <label>Skills (comma-separated)</label>
      <textarea id="skills" rows="3"></textarea>
    </div>
    <div class="field-group">
      <label>Tools/Technologies</label>
      <textarea id="tools" rows="3"></textarea>
    </div>
    <div class="field-group">
      <label>Certifications</label>
      <textarea id="certifications" rows="2"></textarea>
    </div>
    <div class="field-group">
      <label>Languages</label>
      <input id="languages" type="text" />
    </div>
    
    <!-- Job Application Specific -->
    <h2>Job Application Details</h2>
    <div class="field-group">
      <label>Current CTC</label>
      <input id="currentCTC" type="text" />
    </div>
    <div class="field-group">
      <label>Expected CTC</label>
      <input id="expectedCTC" type="text" />
    </div>
    <div class="field-group">
      <label>Notice Period (in days)</label>
      <input id="noticePeriod" type="text" />
    </div>
    <div class="field-group">
      <label>Preferred Locations</label>
      <input id="preferredLocations" type="text" />
    </div>
    <div class="field-group">
      <label>Work Authorization</label>
      <input id="workAuthorization" type="text" />
    </div>
    <div class="field-group">
      <label>Willing to Relocate</label>
      <select id="willingToRelocate">
        <option value="">Select...</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>
    <div class="field-group">
      <label>Willing to Travel (%)</label>
      <input id="willingToTravel" type="text" />
    </div>
    
    <!-- Additional Fields -->
    <h2>Additional Information</h2>
    <div class="field-group">
      <label>Date of Birth (DD/MM/YYYY)</label>
      <input id="dateOfBirth" type="text" />
    </div>
    <div class="field-group">
      <label>Gender</label>
      <select id="gender">
        <option value="">Select...</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
        <option value="Prefer not to say">Prefer not to say</option>
      </select>
    </div>
    <div class="field-group">
      <label>Nationality</label>
      <input id="nationality" type="text" />
    </div>

    <!-- Custom Fields -->
    <h2>Custom Fields</h2>
    <div id="customFieldsContainer"></div>
    <div class="field-group">
      <input id="newCustomKey" type="text" placeholder="Field key, e.g. Relevant Projects" />
      <input id="newCustomValue" type="text" placeholder="Field value" />
      <button id="addCustom">Add</button>
    </div>

    <!-- Actions -->
    <button id="saveProfile">Save Profile</button>
    <button id="autoFillBtn">Auto Fill This Page</button>

    <script src="popup.js"></script>
  </body>
</html>
